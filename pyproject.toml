[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paraphe"
version = "0.1.1"
description = "Self-hosted owner decision inbox: an agent asks, the owner answers, the agent resumes."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []
keywords = ["decision", "approval", "inbox", "mcp", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
paraphe = "paraphe.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paraphe"]

[tool.hatch.build.targets.sdist]
include = ["src/paraphe", "LICENSE", "README.md", "config.example.toml"]
